name: Windows x64 portable EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Compile and bundle official yt-dlp and dependencies
        shell: pwsh
        run: ./build_windows.ps1
      - name: Publish portable archive as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDLPStudio-Windows-x64-portable
          path: dist/YTDLPStudio-Windows-x64-portable.zip
          if-no-files-found: error
